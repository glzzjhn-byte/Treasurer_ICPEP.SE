name: Protect Officers JSON
on:
  pull_request:
    paths:
      - 'officers.json'

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr_branch
          
      - name: Checkout Main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_branch

      - name: Validate Additions and Limits
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read both files
            const oldContent = fs.readFileSync('./main_branch/officers.json', 'utf8');
            const newContent = fs.readFileSync('./pr_branch/officers.json', 'utf8');
            
            const getNames = (content) => [...content.matchAll(/"([^"]+)"/g)].map(m => m[1]);
            const normalize = (str) => str.toLowerCase().replace(/[\s\.\-\_]/g, '');
            
            const oldNames = getNames(oldContent);
            const newNames = getNames(newContent);
            
            const normalizedNewNames = newNames.map(normalize);
            
            for (const oldName of oldNames) {
              if (!normalizedNewNames.includes(normalize(oldName))) {
                core.setFailed(`❌ Error: You are not allowed to delete or modify existing officers. Missing: ${oldName}`);
                return;
              }
            }
            
            for (const newName of newNames) {
              if (newName.length > 50) {
                core.setFailed(`❌ Error: The name '${newName}' is too long (${newName.length} characters). Please use 50 characters or less.`);
                return;
              }
            }
            
            console.log("✅ Validation passed! The new names look great.");
