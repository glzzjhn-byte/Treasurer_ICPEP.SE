name: Core Validation
on:
  pull_request_target:
    paths:
      - 'officers.json'

permissions:
  pull-requests: write
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr_branch
          
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main_branch

      - name: Execute Integrity Sequence
        uses: actions/github-script@v7
        with:
          script: |
            // Branch Auth
            const fs = require('fs');
            
            const c1 = fs.readFileSync('./main_branch/officers.json', 'utf8');
            const c2 = fs.readFileSync('./pr_branch/officers.json', 'utf8');
            
            const ext = (c) => [...c.matchAll(/"([^"]+)"/g)].map(m => m[1]);
            const nrm = (s) => s.toLowerCase().replace(/[\s\.\-\_]/g, '');
            
            const a = ext(c1);
            const b = ext(c2);
            const nb = b.map(nrm);
            
            for (const x of a) {
              if (!nb.includes(nrm(x))) {
                core.setFailed(`❌ Verification Failed: Integrity check rejected.`);
                return;
              }
            }
            
            for (const y of b) {
              if (y.length > 50) {
                core.setFailed(`❌ Verification Failed: Data exceeds allowed parameters.`);
                return;
              }
            }
            
            console.log("✅ Sequence verified.");

      - name: Finalize Sequence
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: '✅ Verified.'
            });
            
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash'
            });
