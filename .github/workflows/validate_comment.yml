name: Validate Gmail Comments
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  check-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Gmail in Comment
        uses: actions/github-script@v7
        with:
          script: |
            // Ignore comments made by the bot itself
            if (context.actor === 'github-actions[bot]') return;
            
            // Only run this check on Issue #1
            if (context.issue.number !== 1) return;

            const body = context.payload.comment.body;
            
            // Check for valid Gmail and reject school/edu domains
            const validGmailRegex = /[a-zA-Z0-9._%+-]+@gmail\.com(?:\s|$)/i;
            const hasGmail = validGmailRegex.test(body);
            const hasSchoolDomain = /@.*\.edu/i.test(body);
            
            if (!hasGmail || hasSchoolDomain) {
              // Warn the user
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `@${context.actor} ❌ **Invalid Email.** Please comment a valid personal Gmail address ending in \`@gmail.com\`. School emails are not allowed.`
              });
              
              // Delete their invalid comment
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id
              });
            }
